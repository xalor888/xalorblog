# 阿里云 ESA（边缘安全加速）前置：真实客户端 IP 还原 + 接入自检日志
#
# 用法（http 上下文，见 nginx.conf.example 顶部）：
#     include /path/to/xalorblog/deploy/nginx-realip-esa.conf;
#
# ══════════════════════════════════════════════════════════════════════════
# 一、为什么这条是「必须」而不是「优化」
# ══════════════════════════════════════════════════════════════════════════
# 套上 ESA 后，Nginx 的 TCP 对端是 ESA 回源节点，不是访客。本应用的安全模型
# 全部以 req.ip 为维度：通行证票据绑定 IP（gate.js）、读接口限流与正文刮取窗
# （readLimiter / scrapeGuard）、点赞与留言防刷窗口、以及 IP 信誉分与自动封禁
# （ipGuard）。不还原真实 IP 的后果不是「统计不准」，而是：
#   1) 一个访客的垃圾提交会把「ESA 回源节点」这个 IP 打成封禁 → 该节点后面
#      所有访客全站 403（不是封一个人，是封一批人）；
#   2) 整节点共用一个限流额度与刮取窗 → 正常读者被 429 误伤。
#
# ══════════════════════════════════════════════════════════════════════════
# 二、同一个坑的第二半：源站必须禁止直连
# ══════════════════════════════════════════════════════════════════════════
# set_real_ip_from 只对「来自所列网段」的连接生效，因此直连源站的攻击者伪造
# X-Forwarded-For 是无效的（不会被信任）。但源站 IP 一旦暴露，攻击者可以完全
# 绕过 ESA 直连源站：ESA 的 WAF/CC/Bot 防护全部被绕开，而应用层的限流与封禁
# 只作用在攻击者自己的连接上 —— 等于没有防护。
# 所以：在云安全组/防火墙层，入方向 80/443 只放行 ESA 回源网段，22 只放行
# 你自己的办公/跳板 IP。无法用安全组时，用 nginx-locations.inc 顶部的
# 「源站校验头」兜底。
#
# ══════════════════════════════════════════════════════════════════════════
# 三、你需要填的东西（从 ESA 控制台抄）
# ══════════════════════════════════════════════════════════════════════════
# ESA 控制台的「回源 IP 段」列表（厂商会更新，建议每季度同步一次）。
# 未填写的效果是「fail-safe」而非报错：没有受信网段时 realip 不生效，
# $remote_addr 仍是 ESA 节点 IP —— 站点不会坏，但上面第一节的误伤会发生。
# 因此接完必须做第四节的验证。
# ══════════════════════════════════════════════════════════════════════════

    # ── ESA 回源网段（用控制台实际列表逐段替换下面占位；IPv6 同理）──
    # set_real_ip_from 203.0.113.0/24;
    # set_real_ip_from 203.0.113.128/25;
    # set_real_ip_from 2001:db8::/32;

    # X-Forwarded-For：ESA 默认在回源请求里带回访客真实 IP。
    # 首次接入请按第四节确认 ESA 实际发的头（不同产品线/加速区域可能使用
    # X-Real-IP 或厂商私有头），以「实际观察到的」为准，不要照抄。
    real_ip_header X-Forwarded-For;

    # 递归剥离：ESA 的 XFF 常形如 "访客IP, ESA节点"。从右往左跳过受信网段，
    # 取第一个不受信地址（也就是访客）。不开这一项会取到 ESA 节点自身。
    real_ip_recursive on;

    # ── 接入自检日志 ──────────────────────────────────────────────────────
    # $remote_addr      = realip 还原后的地址（应用真正看到的 req.ip）
    # $realip_remote_addr = 还原前的 TCP 对端
    # 两者相等且都是 ESA 回源 IP → 还原没生效（网段没填对 / 头选错）
    # $remote_addr 是你的访客 IP、$realip_remote_addr 是 ESA 节点 → 生效
    log_format xalor_esa '$remote_addr - [$time_local] "$request" $status '
                         'bytes=$body_bytes_sent rt=$request_time '
                         'peer="$realip_remote_addr" xff="$http_x_forwarded_for" '
                         'host="$host" cache="$upstream_cache_status"';
    access_log /var/log/nginx/xalor-access.log xalor_esa buffer=32k flush=5s;

    # 注意：上面的 log_format 定义在 http 上下文（本文件被 nginx.conf 的 http 段
    # include），若你的站点配置不在 sites-enabled 里而是手写 http{} 块，请把
    # log_format 与 access_log 两行挪到 http{} 内，其余 realip 行可留在 server 级。

# ══════════════════════════════════════════════════════════════════════════
# 四、接完怎么验证（三条）
# ══════════════════════════════════════════════════════════════════════════
# 1) 真实 IP 是否还原
#       tail -f /var/log/nginx/xalor-access.log
#    然后用手机流量（换一个公网出口）访问站点，观察该请求的
#    $remote_addr 是否等于手机的公网 IP、$realip_remote_addr 是否为 ESA 节点。
#
# 2) 自定义头是否被 ESA 透传（这条不通 = 整个反爬链路失效）
#       cd server && TEST_BASE=https://<你的域名> node test/client.js   # 或直接跑
#       node test/run.js journey.test.js
#    需要透传的请求头：X-Pass / X-Sig / X-Nonce / X-Timestamp / X-Fp / X-Hp-Field
#    需要保留的响应头：X-Request-Id / Vary（Vary 缺失会让 CDN 串域名缓存）
#
# 3) 压缩是否单层、缓存是否按预期
#       curl -sI -H 'Accept-Encoding: gzip' https://<你的域名>/assets/<任意带哈希的 js>
#    看 Content-Encoding 出现次数：应为 1（源站已 gzip，ESA 不应二次编码）。
#       curl -sI https://<你的域名>/api/health/live | grep -i 'x-cache\|age'
#    应为不缓存（无 HIT / Age=0）。
#
# ══════════════════════════════════════════════════════════════════════════
# 五、回滚
# ══════════════════════════════════════════════════════════════════════════
# 本文件是向后兼容的：网段留空 = 不生效；请求不是从受信网段来的 = 不生效。
# 因此回滚只需在 ESA 侧把域名解析指回源站即可，源站 nginx 一行都不用改。

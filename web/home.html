<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- RSS 自动发现：主页域订阅源是「手记」摘要（由后端按 Host 派发） -->
    <link rel="alternate" type="application/rss+xml" title="Xalor 的手记" href="/api/rss.xml" />
    <!-- viewport-fit=cover：让页面画到刘海/灵动岛/Home 指示条区域，再用
         env(safe-area-inset-*) 把内容避让回来（token 见 main.css 的 --sat/--sab）。
         没有 cover 时 env() 全是 0，安全区形同虚设。
         interactive-widget=resizes-content：安卓软键盘弹出时压小布局视口，
         而不是盖住底部输入框（iOS 默认就是压小，这里只是对齐行为）。
         不写 maximum-scale / user-scalable：禁缩放是拿缺陷掩盖缺陷。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Xalor 的个人主页 - 手记、日常与朋友" />
    <meta name="theme-color" content="#e4573d" />
    <!-- 主页域独立的 manifest：安装到桌面时显示的是「Xalor 的个人主页」，而不是博客名。
         两个域名的 start_url 都是 /，由各自的 nginx 默认文档决定落到哪个入口 -->
    <link rel="manifest" href="/manifest-home.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Xalor" />
    <!-- 页面级 CSP：与博客入口同一策略（仅同源脚本，无 unsafe-inline） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://v1.hitokoto.cn; font-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xalor 的个人主页" />
    <meta property="og:description" content="留下手记、日常和朋友。" />
    <meta property="og:site_name" content="Xalor" />
    <!-- og:image 不在这里硬编码：相对路径会被社交平台忽略（要求绝对 URL），
         改由 src/utils/pageMeta.js 在运行时按站点域名绝对化后写入。 -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Xalor 的个人主页" />
    <meta name="twitter:description" content="留下手记、日常和朋友。" />
    <title>Xalor 的个人主页</title>
    <!-- 主题初始化（外部文件，同步阻塞加载防闪烁）；?v= 语义与 index.html 一致 -->
    <script src="/theme-init.js?v=20261006"></script>
    <script src="/anti-debug.js?v=20261018c"></script>
  </head>
  <body>
    <!-- 启动骨架（同 index.html）：慢速网络下 #app 原本是纯空白，
         读者看不到任何加载迹象。Vue 挂载时整体替换。只用内联样式。 -->
    <div id="app">
      <div aria-hidden="true" style="max-width:620px;margin:0 auto;padding:96px 20px 40px;">
        <div style="height:76px;width:76px;border-radius:50%;background:rgba(128,128,128,0.16);margin-bottom:22px;"></div>
        <div style="height:24px;width:48%;border-radius:6px;background:rgba(128,128,128,0.16);margin-bottom:16px;"></div>
        <div style="height:14px;width:88%;border-radius:5px;background:rgba(128,128,128,0.11);margin-bottom:10px;"></div>
        <div style="height:14px;width:66%;border-radius:5px;background:rgba(128,128,128,0.11);margin-bottom:34px;"></div>
        <div style="height:132px;width:100%;border-radius:14px;background:rgba(128,128,128,0.09);"></div>
      </div>
      <p role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">正在加载页面…</p>
    </div>
    <div id="float-dock" class="float-dock"></div>
    <script type="module" src="/src/main-home.js"></script>
    <script src="/boot-guard.js?v=20261025"></script>
  </body>
</html>

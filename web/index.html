<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- RSS 自动发现：订阅器/浏览器可识别订阅源 -->
    <link rel="alternate" type="application/rss+xml" title="Xalor的小站" href="/api/rss.xml" />
    <!-- viewport-fit=cover：让页面画到刘海/灵动岛/Home 指示条区域，再用
         env(safe-area-inset-*) 把内容避让回来（token 见 main.css 的 --sat/--sab）。
         没有 cover 时 env() 全是 0，安全区形同虚设。
         interactive-widget=resizes-content：安卓软键盘弹出时压小布局视口，
         而不是盖住底部输入框（iOS 默认就是压小，这里只是对齐行为）。
         不写 maximum-scale / user-scalable：禁缩放是拿缺陷掩盖缺陷。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Xalor的小站 - 记录技术、生活与思考的个人博客" />
    <meta name="theme-color" content="#e4573d" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Xalor的小站" />
    <!-- 页面级 CSP：仅允许同源脚本（无 unsafe-inline —— 主题初始化已移至外部文件）。
         注意：frame-ancestors 不能通过 meta CSP 生效；生产反向代理必须在 HTTP 响应头中
         下发 `Content-Security-Policy: frame-ancestors 'none'`（并建议同时下发 X-Frame-Options: DENY）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://v1.hitokoto.cn; font-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Open Graph：首页社交分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xalor的小站" />
    <meta property="og:description" content="记录技术、生活与思考的个人博客" />
    <meta property="og:site_name" content="Xalor的小站" />
    <!-- og:image 不在这里硬编码：相对路径会被社交平台忽略（要求绝对 URL），
         改由 src/utils/pageMeta.js 在运行时按站点域名绝对化后写入。 -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Xalor的小站" />
    <meta name="twitter:description" content="记录技术、生活与思考的个人博客" />
    <title>Xalor的小站</title>
    <!-- 主题初始化（外部文件，同步阻塞加载防闪烁；配合 script-src 'self' 无内联脚本） -->
    <!-- ?v= 是必需的：public/ 下的脚本不进打包、没有内容哈希，浏览器和 CDN
         都按扩展名给它强缓存。不带版本号改动后老访客会继续跑旧脚本
         （曾导致「复制已放开」上线两小时仍有人被拦）。改这两个文件时必须递增 v，
         且 CDN 缓存键必须保留查询串（见 deploy/README.md 的 CDN 接入清单）。 -->
    <script src="/theme-init.js?v=20261006"></script>
    <!-- 反调试：最早加载，防 DevTools 分析 -->
    <script src="/anti-debug.js?v=20261018c"></script>
  </head>
  <body>
    <!-- 启动骨架：放在 #app 内部，Vue 挂载时会整体替换掉。
         为什么需要：实测在慢速网络（1.5s 延迟 / 20KB/s）下，
         JS bundle 下载完之前 #app 是**纯空白**，读者看到的是一片白，
         没有任何「正在加载」的迹象。骨架让首屏立刻有东西。
         关键约束：
         - 只用内联样式（此时还没有 CSS，引用外部类等于没样式）；
         - 不依赖任何脚本；
         - 用系统字体，不触发额外下载；
         - 尊重 prefers-reduced-motion，关掉动画。 -->
    <div id="app">
      <div class="boot-skeleton" aria-hidden="true" style="max-width:760px;margin:0 auto;padding:88px 20px 40px;">
        <div style="height:26px;width:42%;border-radius:6px;background:rgba(128,128,128,0.16);margin-bottom:28px;"></div>
        <div style="height:14px;width:100%;border-radius:5px;background:rgba(128,128,128,0.11);margin-bottom:11px;"></div>
        <div style="height:14px;width:92%;border-radius:5px;background:rgba(128,128,128,0.11);margin-bottom:11px;"></div>
        <div style="height:14px;width:64%;border-radius:5px;background:rgba(128,128,128,0.11);margin-bottom:34px;"></div>
        <div style="height:150px;width:100%;border-radius:14px;background:rgba(128,128,128,0.09);margin-bottom:18px;"></div>
        <div style="height:150px;width:100%;border-radius:14px;background:rgba(128,128,128,0.09);"></div>
      </div>
      <p class="boot-sr" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">正在加载页面…</p>
    </div>
    <!-- 右下角浮层栈：静态容器，全局工具/文章互动/问 AI 都 teleport 进这一列。
         放在 #app 之外是为了让它先于任何组件存在（同源组件内的目标在挂载时还查不到） -->
    <div id="float-dock" class="float-dock"></div>
    <script type="module" src="/src/main.js"></script>
    <script src="/boot-guard.js?v=20261025"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- RSS 自动发现：订阅器/浏览器可识别订阅源 -->
    <link rel="alternate" type="application/rss+xml" title="Xalor的小站" href="/api/rss.xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Xalor的小站 - 记录技术、生活与思考的个人博客" />
    <meta name="theme-color" content="#e4573d" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Xalor的小站" />
    <!-- 页面级 CSP：仅允许同源脚本（无 unsafe-inline —— 主题初始化已移至外部文件）。
         注意：frame-ancestors 不能通过 meta CSP 生效；生产反向代理必须在 HTTP 响应头中
         下发 `Content-Security-Policy: frame-ancestors 'none'`（并建议同时下发 X-Frame-Options: DENY）。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://v1.hitokoto.cn; font-src 'self' data:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <!-- Open Graph：首页社交分享 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Xalor的小站" />
    <meta property="og:description" content="记录技术、生活与思考的个人博客" />
    <meta property="og:site_name" content="Xalor的小站" />
    <meta property="og:image" content="/og-image.webp" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Xalor的小站" />
    <meta name="twitter:description" content="记录技术、生活与思考的个人博客" />
    <title>Xalor的小站</title>
    <!-- 主题初始化（外部文件，同步阻塞加载防闪烁；配合 script-src 'self' 无内联脚本） -->
    <!-- ?v= 是必需的：public/ 下的脚本不进打包、没有内容哈希，浏览器和 Cloudflare
         都按扩展名给它 4 小时强缓存。不带版本号改动后老访客会继续跑旧脚本
         （曾导致「复制已放开」上线两小时仍有人被拦）。改这两个文件时必须递增 v。 -->
    <script src="/theme-init.js?v=20261001b"></script>
    <!-- 反调试：最早加载，防 DevTools 分析 -->
    <script src="/anti-debug.js?v=20261001b"></script>
  </head>
  <body>
    <div id="app"></div>
    <!-- 右下角浮层栈：静态容器，全局工具/文章互动/问 AI 都 teleport 进这一列。
         放在 #app 之外是为了让它先于任何组件存在（同源组件内的目标在挂载时还查不到） -->
    <div id="float-dock" class="float-dock"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
